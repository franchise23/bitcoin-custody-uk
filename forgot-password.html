<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password · Bitcoin Custody UK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    const host = window.location.hostname || "";
    const isLocalDev = host === "localhost" || host === "127.0.0.1" || host === "" || window.location.protocol === "file:";
    window.API_BASE = isLocalDev ? "http://localhost:4100" : "https://quantum-ledger-org.onrender.com";
  </script>
</head>
<body class="auth-page" data-page="forgot">
  <header class="auth-topbar">
    <div class="container auth-topbar-inner">
      <a href="index.html" class="brand-lockup" aria-label="Bitcoin Custody UK homepage">
        <span class="brand-mark" aria-hidden="true"><span class="brand-mark-inner"></span></span>
        <span class="brand-wordmark">
          <span class="brand-wordmark-top">Bitcoin</span>
          <span class="brand-wordmark-bottom">Custody UK</span>
        </span>
      </a>
    </div>
  </header>

  <main class="auth-shell">
    <div class="auth-card">
      <div class="auth-header">
        <span class="eyebrow">Password recovery</span>
        <h1>Reset your password</h1>
        <p>Enter your email address and we’ll send you a secure reset link.</p>
      </div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label for="forgot-email">Email address</label>
          <input id="forgot-email" type="email" autocomplete="email" required />
        </div>

        <button id="forgot-button" class="btn btn-primary auth-submit" type="submit">Send reset link</button>
      </form>

      <div id="auth-feedback" class="auth-feedback" aria-live="polite"></div>
      <div class="auth-foot">
        <p><a href="login.html">Back to login</a></p>
      </div>
    </div>
  </main>

  <script src="auth.js"></script>
</body>
</html>
