<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New password · Bitcoin Custody UK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    const host = window.location.hostname || "";
    const isLocalDev = host === "localhost" || host === "127.0.0.1" || host === "" || window.location.protocol === "file:";
    window.API_BASE = isLocalDev ? "http://localhost:4100" : "https://quantum-ledger-org.onrender.com";
  </script>
</head>
<body class="auth-page" data-page="reset">
  <header class="auth-topbar">
    <div class="container auth-topbar-inner">
      <a href="index.html" class="brand-lockup" aria-label="Bitcoin Custody UK homepage">
        <span class="brand-mark" aria-hidden="true"><span class="brand-mark-inner"></span></span>
        <span class="brand-wordmark">
          <span class="brand-wordmark-top">Bitcoin</span>
          <span class="brand-wordmark-bottom">Custody UK</span>
        </span>
      </a>
    </div>
  </header>

  <main class="auth-shell">
    <div class="auth-card">
      <div class="auth-header">
        <span class="eyebrow">Set a new password</span>
        <h1>Create your new password</h1>
        <p>Choose a strong, unique password to secure your account.</p>
      </div>

      <form id="reset-form" novalidate>
        <div class="form-group password-field">
          <label for="reset-password">New password</label>
          <div class="password-input-wrap">
            <input id="reset-password" type="password" autocomplete="new-password" required />
            <button type="button" class="toggle-password" data-toggle-password="reset-password" aria-label="Show password">Show</button>
          </div>
        </div>

        <div class="form-group password-field">
          <label for="reset-confirm-password">Confirm new password</label>
          <div class="password-input-wrap">
            <input id="reset-confirm-password" type="password" autocomplete="new-password" required />
            <button type="button" class="toggle-password" data-toggle-password="reset-confirm-password" aria-label="Show password">Show</button>
          </div>
        </div>

        <div class="password-strength-card">
          <div class="strength-row">
            <span>Password strength</span>
            <strong id="reset-strength-text">Not started</strong>
          </div>
          <div class="strength-meter"><span id="reset-strength-meter"></span></div>
          <ul id="reset-requirements" class="password-requirements">
            <li><span>•</span> 8+ characters</li>
            <li><span>•</span> One uppercase letter</li>
            <li><span>•</span> One lowercase letter</li>
            <li><span>•</span> One number</li>
            <li><span>•</span> One special character</li>
          </ul>
        </div>

        <button id="reset-button" class="btn btn-primary auth-submit" type="submit">Update password</button>
      </form>

      <div id="auth-feedback" class="auth-feedback" aria-live="polite"></div>
      <div class="auth-foot">
        <p><a href="login.html">Back to login</a></p>
      </div>
    </div>
  </main>

  <script src="auth.js"></script>
</body>
</html>
