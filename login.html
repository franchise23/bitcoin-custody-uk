<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Bitcoin Custody UK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="quantum-utils.js"></script>
  <script>
    const host = window.location.hostname || "";
    const isLocalDev = host === "localhost" || host === "127.0.0.1" || host === "" || window.location.protocol === "file:";
    if (isLocalDev) {
      window.API_BASE = "http://localhost:4100";
    } else if (host.includes("bitcoin-custody-uk") || host.includes("github.io")) {
      window.API_BASE = "https://bitcoin-custody-uk.onrender.com";
    } else {
      window.API_BASE = "https://bitcoin-custody-uk.onrender.com";
    }
  </script>
</head>
<body class="auth-page" data-page="login">
  <header class="auth-topbar">
    <div class="container auth-topbar-inner">
      <a href="index.html" class="brand-lockup" aria-label="Bitcoin Custody UK homepage">
        <span class="brand-mark" aria-hidden="true"><span class="brand-mark-inner"></span></span>
        <span class="brand-wordmark">
          <span class="brand-wordmark-top">Bitcoin</span>
          <span class="brand-wordmark-bottom">Custody UK</span>
        </span>
      </a>
    </div>
  </header>

  <main class="auth-shell">
    <div class="auth-card">
      <div class="auth-header">
        <span class="eyebrow">Welcome back</span>
        <h1>Log in</h1>
        <p>Access your portfolio, markets, and account activity securely.</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-identifier">Username or email</label>
          <input id="login-identifier" name="identifier" type="text" autocomplete="username" required />
        </div>

        <div class="form-group password-field">
          <label for="login-password">Password</label>
          <div class="password-input-wrap">
            <input id="login-password" name="password" type="password" autocomplete="current-password" required />
            <button type="button" class="toggle-password" data-toggle-password="login-password" aria-label="Show password">Show</button>
          </div>
        </div>

        <div class="auth-row">
          <label class="checkbox-row">
            <input type="checkbox" name="remember" />
            <span>Remember me</span>
          </label>
          <a href="forgot-password.html" class="muted-link">Forgot password?</a>
        </div>

        <button id="login-button" class="btn btn-primary auth-submit" type="submit">Log in</button>

        <div class="auth-foot">
          <p>Need an account? <a href="register.html">Register</a></p>
        </div>
      </form>

      <div id="auth-feedback" class="auth-feedback" aria-live="polite"></div>
    </div>
  </main>

  <script src="auth.js"></script>
</body>
</html>
